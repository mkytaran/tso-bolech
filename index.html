<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portál TSO Bolech</title>

  <!-- Ikony pro PWA / Přidání na plochu mobilu (Modré kolečko, bílé noty) -->
  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%231565c0'/%3E%3Cpath d='M78 24v50a14 14 0 1 1-10-13.4V42L46 48v44a14 14 0 1 1-10-13.4V34a4 4 0 0 1 3-4l35-8a4 4 0 0 1 4 4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 120 120'%3E%3Ccircle cx='60' cy='60' r='60' fill='%231565c0'/%3E%3Cpath d='M78 24v50a14 14 0 1 1-10-13.4V42L46 48v44a14 14 0 1 1-10-13.4V34a4 4 0 0 1 3-4l35-8a4 4 0 0 1 4 4z' fill='%23fff'/%3E%3C/svg%3E">

  <style>
    :root {
      --primary: #221d44; --primary-dark: #16122e; --bg: #f5f6f8; --surface: #ffffff;
      --text: #1a1a1a; --text-muted: #555555; --border: #dcdcdc;
      --success: #2e7d32; --danger: #c62828; --warning: #e65100; --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { background: var(--bg); color: var(--text); padding-bottom: 90px; font-size: 16px; -webkit-tap-highlight-color: transparent; }

    header { background: var(--primary); position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.18); }
    .logo-banner-wrap { width: 100%; background: #221d44; display: flex; justify-content: center; align-items: center; padding: 16px 12px; }
    .brand-title-header { color: #ffffff; font-size: 21px; font-weight: 700; text-align: center; letter-spacing: 0.5px; line-height: 1.3; }
    .header-subbar { background: var(--primary); padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.1); }
    .user-pill { font-size: 14px; background: rgba(255,255,255,0.18); color: #ffffff; padding: 6px 12px; border-radius: 20px; font-weight: 600; cursor: pointer; }

    .container { padding: 16px; max-width: 640px; margin: 0 auto; }
    .card { background: var(--surface); border-radius: var(--radius); margin-bottom: 16px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); border: 1px solid var(--border); overflow: hidden; }
    .card-top-bar { padding: 10px 16px; font-size: 15px; font-weight: 800; display: flex; justify-content: space-between; align-items: center; }

    .bar-koncert { background: #221d44; color: #ffffff; border-bottom: 3px solid #16122e; }
    .bar-generalka { background: #512da8; color: #ffffff; border-bottom: 3px solid #311b92; }
    .bar-zkouska { background: #e3f2fd; color: #1565c0; border-bottom: 3px solid #bbdefb; }

    .card-body { padding: 16px; }
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; padding: 14px; background: var(--primary); color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; }

    .deadline-box { margin: 12px 0; padding: 10px 14px; background: #fff8e1; border-left: 4px solid var(--warning); border-radius: 4px; font-size: 16px; font-weight: 600; }
    .att-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .btn-att { padding: 12px 8px; border: 1.5px solid var(--border); border-radius: 8px; background: white; font-size: 15px; font-weight: 600; cursor: pointer; }
    .btn-att.selected-ano { background: #e8f5e9; color: var(--success); border-color: var(--success); }
    .btn-att.selected-ne { background: #ffebee; color: var(--danger); border-color: var(--danger); }
    .duvod-box { margin-top: 12px; padding: 12px; background: #fafafa; border: 1px solid var(--border); border-radius: 8px; }

    .roster-toggle { margin-top: 12px; background: #f0f2f5; border: 1px solid var(--border); border-radius: 8px; padding: 12px; cursor: pointer; width: 100%; font-weight: 600; display: flex; justify-content: space-between; }
    .roster-content { display: none; background: #fafafa; padding: 12px; border-top: 1px solid var(--border); }
    .roster-section { margin-bottom: 8px; }
    .roster-section-title { font-size: 14px; font-weight: bold; color: var(--primary); text-transform: uppercase; margin-bottom: 2px;}
    .roster-members { font-size: 16px; margin-bottom: 8px; color: var(--text); padding-left: 6px; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); display: flex; justify-content: space-around; border-top: 1px solid var(--border); padding: 10px 0; z-index: 100; }
    .nav-btn { background: none; border: none; font-size: 15px; color: var(--text-muted); cursor: pointer; font-weight: 600; }
    .nav-btn.active { color: var(--primary); font-weight: 800; }

    .modal-overlay { position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); display:flex; justify-content:center; align-items:center; z-index:1000; padding:10px; }
    .modal-box { background:white; padding:20px; border-radius:12px; width:100%; max-width:500px; max-height:90vh; overflow-y:auto; }
    .modal-input { width:100%; padding:10px; margin-bottom:12px; border:1px solid #ccc; border-radius:6px; font-size:16px; }
  </style>
</head>
<body>

  <div id="loginScreen" class="container" style="display:none; margin-top: 20px;">
    <div class="card" style="padding:24px; text-align:center;">
      <h1 style="margin-bottom:16px; color:var(--primary);">TSO Bolech</h1>
      <p style="margin-bottom:16px; color:var(--text-muted);">Zadejte jméno nebo e-mail pro vstup do portálu.</p>
      <form onsubmit="handleLoginSubmit(event)">
        <input type="text" id="loginQuery" required placeholder="Jméno nebo E-mail" class="modal-input">
        <button type="submit" id="loginBtn" class="btn">Vstoupit</button>
      </form>
    </div>
  </div>

  <div id="mainApp" style="display:none;">
    <header>
      <div class="logo-banner-wrap"><h1 class="brand-title-header">TSO Bolech</h1></div>
      <div class="header-subbar"><span>PORTÁL</span><div id="userBadge" class="user-pill" onclick="confirmLogout()">...</div></div>
    </header>
    <div class="container">
      <section id="tab-events">
        <h2 style="margin-bottom:16px;">Program</h2>
        <div id="eventsContainer"><div style="text-align:center; padding:20px;">Načítám data...</div></div>
      </section>
      <section id="tab-sheets" style="display:none;">
        <h2 style="margin-bottom:16px;">Noty</h2>
        <div id="sheetsContainer"><div style="text-align:center; padding:20px;">Načítám data...</div></div>
      </section>
    </div>
    <nav>
      <button class="nav-btn active" onclick="switchTab('events', this)">Akce</button>
      <button class="nav-btn" onclick="switchTab('sheets', this)">Noty</button>
    </nav>
  </div>

  <script>
    // =========================================================================
    // VAŠE URL ADRESA Z GOOGLE APPS SCRIPTU
    // =========================================================================
    const API_URL = "https://script.google.com/macros/s/AKfycbzson2D9uc0UMIPADyVLqLkCKjEDp1d9ECUqAJghqWKIGXMM3jV7-M0T4wliBAncFMjTQ/exec";

    // Globální proměnné
    let user = null;
    let appData = { akce: [], noty: [], ucast: [] };

    const PARTITURA_SECTIONS = ["1. Housle", "2. Housle", "Violy", "Violoncella", "Kontrabasy", "Flétny / Pikola", "Oboje / Anglický roh", "Klarinety", "Fagoty", "Lesní rohy", "Trubky", "Pozouny", "Tuba", "Bicí nástroje", "Klávesy / Klavír", "Ostatní / Hosté"];
    const SMYCKE_SECTIONS = ["housle", "viola", "violy", "cello", "violoncello", "kontrabas"];
    const DECHOVE_SECTIONS = ["flétn", "pikol", "oboj", "klarinet", "fagot", "roh", "trubk", "pozoun", "tuba"];

    // Funkce nahrazující původní google.script.run přes Fetch API
    async function runGoogleScript(action, payload = {}) {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: action, payload: payload })
        });
        return await response.json();
      } catch (error) {
        console.error("Chyba API:", error);
        alert("Chyba při komunikaci se serverem.");
        return { success: false, error: error.toString() };
      }
    }

    // Inicializace
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("bolech_auth_member");
      if(saved) { user = JSON.parse(saved); initApp(); }
      else { document.getElementById("loginScreen").style.display = "block"; }
    });

    function handleLoginSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      btn.innerText = "Ověřuji...";
      btn.disabled = true;

      runGoogleScript("authenticateMember", {query: document.getElementById('loginQuery').value})
      .then(res => {
        btn.innerText = "Vstoupit";
        btn.disabled = false;
        if(res.success) {
          user = res.member;
          localStorage.setItem('bolech_auth_member', JSON.stringify(user));
          document.getElementById('loginScreen').style.display = 'none';
          initApp();
        } else alert(res.error);
      });
    }

    function initApp() {
      document.getElementById("mainApp").style.display = "block";
      document.getElementById("userBadge").innerText = user.name;
      runGoogleScript("getInitialData").then(d => {
        appData = d;
        renderEvents();
        renderSheets();
      });
    }

    // Pomocná funkce na převedení data na číslo pro správné řazení
    function parseDate(dateStr) {
      if (!dateStr) return 0;
      const parts = String(dateStr).trim().split('.');
      if (parts.length >= 3) {
        return new Date(parseInt(parts[2]), parseInt(parts[1])-1, parseInt(parts[0])).getTime();
      }
      return new Date(dateStr).getTime() || 0;
    }

    function escapeHtml(str) {
      return String(str||'').replace(/[&<>'"]/g, tag => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[tag]));
    }

    function isEventVisibleForUser(akce) {
      const nazevL = (akce.nazev||"").toLowerCase(); const typL = (akce.typ||"").toLowerCase();
      const userSecL = (user.section||"").toLowerCase(); const userRole = String(user.role||"").trim().toLowerCase();
      if (userRole !== "" && userRole !== "-") return true; // Admin vidí vše
      if (nazevL.includes("smyčc") || typL.includes("smyčc")) return SMYCKE_SECTIONS.some(s => userSecL.includes(s));
      if (nazevL.includes("dech") || typL.includes("dech")) return DECHOVE_SECTIONS.some(s => userSecL.includes(s));
      return true;
    }

    function renderEvents() {
      const cont = document.getElementById("eventsContainer"); cont.innerHTML = "";
      const userRole = String(user.role||"").trim().toLowerCase();

      // Tlačítko pro přidání akce (pouze vedení/admin)
      if (userRole !== "" && userRole !== "-") {
        cont.innerHTML += `<button class="btn" style="background:#2e7d32; margin-bottom:16px;" onclick="openAkceForm()">➕ Přidat novou akci</button>`;
      }

      // Filtrování a řazení od nejnovější (nahoře) po nejstarší (dole)
      const visibleAkce = appData.akce.filter(a => isEventVisibleForUser(a))
                                      .sort((a,b) => parseDate(b.datum) - parseDate(a.datum));

      if(visibleAkce.length === 0) {
        cont.innerHTML += `<div style="text-align:center; padding:20px;">Žádné akce v plánu.</div>`;
        return;
      }

      visibleAkce.forEach(akce => {
        const myVote = (appData.ucast||[]).find(u => String(u.akceId) === String(akce.id) && u.jmeno === user.name);
        let barClass = akce.typ === 'Koncert' ? 'bar-koncert' : (akce.typ === 'Generálka' ? 'bar-generalka' : 'bar-zkouska');

        let editBtn = "";
        if (userRole !== "" && userRole !== "-") {
          editBtn = `<button onclick='openAkceForm(${JSON.stringify(akce).replace(/'/g, "&#39;")})' style="background:transparent; border:none; cursor:pointer; font-size:20px;">✏️</button>`;
        }

        cont.innerHTML += `
          <div class="card">
            <div class="card-top-bar ${barClass}"><span>${akce.typ}</span><span>📅 ${akce.datum}</span></div>
            <div class="card-body">
              <h3 style="font-size:21px; margin-bottom:6px; display:flex; justify-content:space-between;">
                ${akce.nazev} ${editBtn}
              </h3>
              ${akce.misto ? `<p style="font-size:17px; margin-bottom:4px;">📍 ${akce.misto}</p>` : ''}
              <p style="font-size:17px; margin-bottom:4px;">🕒 Začátek: <strong>${akce.casOd}</strong></p>
              ${akce.casSrazu ? `<p style="font-size:17px; margin-bottom:4px;">⏰ Sraz: <strong>${akce.casSrazu}</strong></p>` : ''}
              ${akce.zacatekGeneralky ? `<p style="font-size:17px; margin-bottom:4px;">🎻 Generálka: <strong>${akce.zacatekGeneralky}</strong></p>` : ''}
              ${akce.damy ? `<p style="font-size:17px; margin-bottom:4px;">👗 Dámy: ${akce.damy}</p>` : ''}
              ${akce.pani ? `<p style="font-size:17px; margin-bottom:4px;">🤵 Páni: ${akce.pani}</p>` : ''}
              ${akce.poznamka ? `<p style="font-size:16px; margin:8px 0;"><strong>Pozn.:</strong> ${akce.poznamka}</p>` : ''}
              ${akce.uzavierka ? `<div class="deadline-box">⏳ Uzávěrka: ${akce.uzavierka}</div>` : ''}

              <div class="att-buttons">
                <button class="btn-att ${myVote?.stav==='Ano'?'selected-ano':''}" onclick="submitUcast('${akce.id}','${akce.datum}','Ano',this)">✓ Ano</button>
                <button class="btn-att ${myVote?.stav==='Ne'?'selected-ne' : ''}" onclick="submitUcast('${akce.id}','${akce.datum}','Ne',this)">✕ Ne</button>
              </div>

              <div id="duvod-${akce.id}" class="duvod-box" style="display:${myVote?.stav==='Ne'&&!myVote?.duvod?'block':'none'}">
                <input type="text" id="in-${akce.id}" placeholder="Důvod neúčasti" class="modal-input" style="margin-bottom:8px;">
                <button class="btn" style="padding:10px;" onclick="saveDuvod('${akce.id}','${akce.datum}',this)">Odeslat důvod</button>
              </div>

              <div id="roster-container-${akce.id}">${generateRosterHtml(akce.id)}</div>
            </div>
          </div>`;
      });
    }

    function generateRosterHtml(akceId) {
      const potvrdili = (appData.ucast || []).filter(u => String(u.akceId) === String(akceId) && u.stav === 'Ano');
      const grouped = {};

      potvrdili.forEach(p => {
        let hracSekce = String(p.sekce || "Ostatní").trim().toLowerCase();
        let nalezenaSekce = PARTITURA_SECTIONS.find(s =>
          s.toLowerCase().includes(hracSekce) || hracSekce.includes(s.toLowerCase())
        ) || "Ostatní / Hosté";

        if (!grouped[nalezenaSekce]) grouped[nalezenaSekce] = [];
        grouped[nalezenaSekce].push(p.jmeno);
      });

      let html = `<button class="roster-toggle" onclick="toggleRoster('${akceId}')">
                    <span>👥 Přihlášení hráči (${potvrdili.length})</span>
                    <span id="arrow-${akceId}">▼</span>
                  </button>
                  <div id="content-${akceId}" class="roster-content">`;

      PARTITURA_SECTIONS.forEach(s => {
        if (grouped[s]) html += `<div class="roster-section"><div class="roster-section-title">${s}</div><div class="roster-members">${grouped[s].join(', ')}</div></div>`;
      });
      if (grouped["Ostatní / Hosté"]) html += `<div class="roster-section"><div class="roster-section-title">Ostatní / Hosté</div><div class="roster-members">${grouped["Ostatní / Hosté"].join(', ')}</div></div>`;
      if (potvrdili.length === 0) html += '<div style="font-size:15px; color:#999; font-style:italic; padding:5px;">Zatím nikdo nepotvrdil účast.</div>';

      return html + '</div>';
    }

    function toggleRoster(id) {
      const content = document.getElementById('content-' + id);
      const arrow = document.getElementById('arrow-' + id);
      if (content.style.display === 'block') { content.style.display = 'none'; arrow.innerText = '▼'; }
      else { content.style.display = 'block'; arrow.innerText = '▲'; }
    }

    function submitUcast(id, datum, stav, btn) {
      const origText = btn.innerText;
      btn.innerText = "Ukládám...";
      runGoogleScript("saveUcast", {akceId: id, datumAkce: datum, jmeno: user.name, sekce: user.section, stav: stav})
      .then(res => {
        btn.innerText = origText;
        if(res.success) {
          document.getElementById('duvod-'+id).style.display = (stav === 'Ne') ? 'block' : 'none';
          btn.parentElement.querySelectorAll('.btn-att').forEach(b => b.className = 'btn-att');
          btn.classList.add(stav === 'Ano' ? 'selected-ano' : 'selected-ne');

          let exist = appData.ucast.find(u => u.akceId === id && u.jmeno === user.name);
          if(exist) exist.stav = stav; else appData.ucast.push({akceId:id, jmeno:user.name, sekce:user.section, stav:stav});
          document.getElementById('roster-container-'+id).innerHTML = generateRosterHtml(id);
        }
      });
    }

    function saveDuvod(id, datum, btn) {
      const duvod = document.getElementById('in-'+id).value;
      btn.innerText = "Ukládám...";
      runGoogleScript("saveUcast", {akceId: id, datumAkce: datum, jmeno: user.name, sekce: user.section, stav: 'Ne', duvod: duvod})
      .then(res => {
        btn.innerText = "Odeslat důvod";
        if(res.success) document.getElementById('duvod-'+id).style.display = 'none';
      });
    }

    // --- MODAL PRO ADMINY S CHYTRÝM SKRÝVÁNÍM ---
    function openAkceForm(akce = null) {
      const isEdit = akce !== null;
      const html = `
        <div id="akceModal" class="modal-overlay">
          <div class="modal-box">
            <h3 style="margin-bottom:16px;">${isEdit ? 'Upravit akci' : 'Nová akce'}</h3>
            <form id="editAkceForm" onsubmit="submitAkceForm(event, '${isEdit ? escapeHtml(akce.id) : ''}')">

              <label>Typ akce:</label>
              <select id="f_typ" class="modal-input" onchange="toggleAkceFields()">
                <option value="Zkouška" ${akce?.typ==='Zkouška'?'selected':''}>Zkouška</option>
                <option value="Generálka" ${akce?.typ==='Generálka'?'selected':''}>Generálka</option>
                <option value="Koncert" ${akce?.typ==='Koncert'?'selected':''}>Koncert</option>
              </select>

              <label>Název:</label>
              <input type="text" id="f_nazev" value="${escapeHtml(akce?.nazev||'')}" required class="modal-input">

              <label>Místo:</label>
              <input type="text" id="f_misto" value="${escapeHtml(akce?.misto||'')}" class="modal-input">

              <label>Datum (např. 15. 8. 2026):</label>
              <input type="text" id="f_datum" value="${escapeHtml(akce?.datum||'')}" required class="modal-input">

              <label>Čas od (např. 18:00):</label>
              <input type="text" id="f_casOd" value="${escapeHtml(akce?.casOd||'')}" class="modal-input">

              <!-- Řádek pro SRAZ a GENERÁLKU -->
              <div id="row_casy" style="display:flex; gap:10px;">
                <div style="flex:1;">
                  <label>Čas srazu:</label>
                  <input type="text" id="f_casSrazu" value="${escapeHtml(akce?.casSrazu||'')}" placeholder="např. 17:30" class="modal-input">
                </div>
                <div id="col_generalka" style="flex:1;">
                  <label>Čas generálky:</label>
                  <input type="text" id="f_zacatekGeneralky" value="${escapeHtml(akce?.zacatekGeneralky||'')}" placeholder="např. 18:00" class="modal-input">
                </div>
              </div>

              <!-- Řádek pro OBLEČENÍ -->
              <div id="row_obleceni" style="display:flex; gap:10px;">
                <div style="flex:1;">
                  <label>Oblečení Dámy:</label>
                  <input type="text" id="f_damy" value="${escapeHtml(akce?.damy||'')}" placeholder="např. černé dlouhé" class="modal-input">
                </div>
                <div style="flex:1;">
                  <label>Oblečení Páni:</label>
                  <input type="text" id="f_pani" value="${escapeHtml(akce?.pani||'')}" placeholder="např. frak" class="modal-input">
                </div>
              </div>

              <label>Poznámka:</label>
              <textarea id="f_poznamka" class="modal-input">${escapeHtml(akce?.poznamka||'')}</textarea>

              <div style="display:flex; gap:10px;">
                <button type="submit" id="btnSaveModal" class="btn">Uložit</button>
                <button type="button" class="btn" style="background:#999;" onclick="document.getElementById('akceModal').remove()">Zrušit</button>
              </div>
            </form>
          </div>
        </div>
      `;
      document.body.insertAdjacentHTML('beforeend', html);

      toggleAkceFields(); // Zavoláme pro skrytí prvků ihned po otevření
    }

    // Funkce, která řeší skrývání podle typu akce
    function toggleAkceFields() {
      const typ = document.getElementById('f_typ').value;
      const rowCasy = document.getElementById('row_casy');
      const colGeneralka = document.getElementById('col_generalka');
      const rowObleceni = document.getElementById('row_obleceni');

      if (typ === 'Zkouška') {
        rowCasy.style.display = 'none';
        rowObleceni.style.display = 'none';
      } else if (typ === 'Generálka') {
        rowCasy.style.display = 'flex';
        colGeneralka.style.display = 'none';
        rowObleceni.style.display = 'none';
      } else { // Koncert
        rowCasy.style.display = 'flex';
        colGeneralka.style.display = 'block';
        rowObleceni.style.display = 'flex';
      }
    }

    function submitAkceForm(e, akceId) {
      e.preventDefault();
      document.getElementById('btnSaveModal').innerText = "Ukládám...";

      const typ = document.getElementById('f_typ').value;
      const isZkouska = (typ === 'Zkouška');
      const isGeneralka = (typ === 'Generálka');

      const payload = {
        id: akceId || null,
        typ: typ,
        nazev: document.getElementById('f_nazev').value,
        misto: document.getElementById('f_misto').value,
        datum: document.getElementById('f_datum').value,
        casOd: document.getElementById('f_casOd').value,

        casSrazu: isZkouska ? "" : document.getElementById('f_casSrazu').value,
        zacatekGeneralky: (isZkouska || isGeneralka) ? "" : document.getElementById('f_zacatekGeneralky').value,
        damy: (isZkouska || isGeneralka) ? "" : document.getElementById('f_damy').value,
        pani: (isZkouska || isGeneralka) ? "" : document.getElementById('f_pani').value,

        poznamka: document.getElementById('f_poznamka').value
      };

      runGoogleScript("saveAkce", payload).then(res => {
        if (res.success) {
          document.getElementById('akceModal').remove();
          initApp();
        } else {
          alert('Chyba: ' + res.error);
          document.getElementById('btnSaveModal').innerText = "Uložit";
        }
      });
    }

    // Pomocné funkce pro záložky
    function switchTab(t, b) {
      document.getElementById('tab-events').style.display = t==='events'?'block':'none';
      document.getElementById('tab-sheets').style.display = t==='sheets'?'block':'none';
      document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
      b.classList.add('active');
    }

    function renderSheets() {
      const cont = document.getElementById("sheetsContainer");
      if(appData.noty.length === 0) { cont.innerHTML = "Žádné noty k dispozici."; return; }
      cont.innerHTML = appData.noty.map(n => `<div class="card card-body" style="display:flex; justify-content:space-between;"><div><strong>${n.nazev}</strong><br><small>${n.skladatel}</small></div>${n.link ? `<a href="${n.link}" target="_blank" class="btn" style="width:auto; padding:8px 12px; font-size:14px;">PDF</a>` : ''}</div>`).join('');
    }

    function confirmLogout() {
      if(confirm("Opravdu se chcete odhlásit?")) { localStorage.removeItem('bolech_auth_member'); location.reload(); }
    }
  </script>
</body>
</html>
