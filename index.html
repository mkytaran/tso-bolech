<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portál TSO Bolech</title>
  
  <!-- Nastavení pro samostatnou aplikaci (PWA) -->
  <!-- ============================================== -->
  <!-- 1. ANDROID & BĚŽNÉ PROHLÍŽEČE                  -->
  <!-- ============================================== -->
  <meta name="theme-color" content="#052634">
  <link rel="manifest" href="manifest.json?v=1.1">
  <link rel="icon" type="image/png" href="icon-android.png">

  <!-- ============================================== -->
  <!-- 2. APPLE iOS (iPhone / iPad)                   -->
  <!-- ============================================== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bolech">
  <link rel="apple-touch-icon" href="icon-iphone.png">

  <!-- ============================================== -->
  <!-- ODKAZ NA EXTERNÍ CSS S VERZÍ (Cache busting)   -->
  <!-- ============================================== -->
  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
  
  <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
  <div id="loginScreen" class="container" style="display:none; margin-top: 40px;">
    <div class="card" style="padding:32px; text-align:center;">
      <h1 style="margin-bottom:12px; color:var(--text); font-size: 26px;">Vítejte</h1>
      <p style="margin-bottom:24px; color:var(--text-muted);">Zadejte své jméno nebo e-mail pro vstup do portálu orchestru.</p>
      <form onsubmit="handleLoginSubmit(event)">
        <input type="text" id="loginQuery" required placeholder="Jméno nebo E-mail" class="modal-input" style="margin-bottom: 12px;">
        <!-- Nové políčko typu password skrývá zadávané znaky -->
        <input type="password" id="loginPin" required placeholder="Váš PIN kód" class="modal-input" style="margin-bottom: 16px;">
        <button type="submit" id="loginBtn" class="btn">Vstoupit</button>
      </form>
    </div>
  </div>

  <!-- HLAVNÍ APLIKACE -->
  <div id="mainApp" style="display:none;">
    <header>
      <!-- Záhlaví řízené pomocí CSS -->
      <div class="logo-banner-wrap">
        <button class="theme-toggle" onclick="toggleTheme()">
          <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
      <div class="header-subbar"><span>ČLENSKÝ PORTÁL</span><div id="userBadge" class="user-pill" onclick="confirmLogout()">...</div></div>
    </header>
    
    <div class="container">
      <section id="tab-events">
        <div id="eventsContainer"><div style="text-align:center; padding:40px; color:var(--text-muted);">Načítám data...</div></div>
      </section>
      <section id="tab-sheets" style="display:none;">
        <div id="sheetsContainer"><div style="text-align:center; padding:40px; color:var(--text-muted);">Načítám data...</div></div>
      </section>
    </div>

    <!-- SPODNÍ NAVIGACE -->
    <nav>
      <button class="nav-btn active" onclick="switchTab('events', this)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        Akce
      </button>
      <button class="nav-btn" onclick="switchTab('sheets', this)">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Noty
      </button>
    </nav>
  </div>

  <!-- ============================================== -->
  <!-- ODKAZ NA EXTERNÍ JAVASCRIPT S VERZÍ            -->
  <!-- ============================================== -->
  <script src="app.js?v=1.1"></script>
</body>
</html>
