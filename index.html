<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portál TSO Bolech</title>
  
  <!-- Nastavení pro samostatnou aplikaci (PWA) -->
  <!-- ============================================== -->
  <!-- 1. ANDROID & BĚŽNÉ PROHLÍŽEČE                  -->
  <!-- ============================================== -->
  <meta name="theme-color" content="#052634">
  <link rel="manifest" href="manifest.json?v=1.1">
  <link rel="icon" type="image/png" href="icon-android.png">

  <!-- ============================================== -->
  <!-- 2. APPLE iOS (iPhone / iPad)                   -->
  <!-- ============================================== -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bolech">
  <link rel="apple-touch-icon" href="icon-iphone.png">

  <!-- ============================================== -->
  <!-- ODKAZ NA EXTERNÍ CSS S VERZÍ (Cache busting)   -->
  <!-- ============================================== -->
  <link rel="stylesheet" href="style.css?v=1.0">
</head>
<body>
  
  <!-- PŘIHLAŠOVACÍ OBRAZOVKA -->
  <div id="loginScreen" class="container" style="display:none; margin-top: 40px;">
    <div class="card" style="padding:32px; text-align:center;">
      <h1 style="margin-bottom:12px; color:var(--text); font-size: 26px;">Vítejte</h1>
      <p style="margin-bottom:24px; color:var(--text-muted);">Zadejte své jméno nebo e-mail pro vstup do portálu orchestru.</p>
      <form onsubmit="handleLoginSubmit(event)">
        <input type="text" id="loginQuery" required placeholder="Jméno nebo E-mail" class="modal-input" style="margin-bottom: 12px;">
        <!-- Nové políčko typu password skrývá zadávané znaky -->
        <input type="password" id="loginPin" required placeholder="Váš PIN kód" class="modal-input" style="margin-bottom: 16px;">
        <button type="submit" id="loginBtn" class="btn">Vstoupit</button>
      </form>
    </div>
  </div>

  <!-- HLAVNÍ APLIKACE -->
  <div id="mainApp" style="display:none;">
  <header class="app-header">
  <img src="logo-transparent.png" alt="TSO Bolech" class="header-logo">
  
  <div class="header-actions">
    <button class="theme-toggle" onclick="toggleTheme()">
      <svg id="theme-icon" xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
    <div id="userBadge" class="user-pill" onclick="confirmLogout()">...</div>
  </div>
  </header>
    
    <div class="container">
    <div id="tab-events">
      <div id="eventsContainer">Načítám data...</div>
    </div>
    
    <!-- Změněný nadpis na Infoarchiv -->
    <div id="tab-archive" style="display: none;">
      <h2 style="margin-bottom: 16px; font-size: 20px;">Infoarchiv</h2>
      <div id="archiveContainer"></div>
    </div>
  </div>

  <nav>
    <button class="nav-btn active" onclick="switchTab('events', this)">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 012 2v14a2 2 0 01-2 2H5a2 2 0 01-2-2V6a2 2 0 012-2z"/></svg>
      Akce
    </button>
    
    <!-- Změněný text tlačítka na Infoarchiv -->
    <button class="nav-btn" onclick="switchTab('archive', this)">
      <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg>
      Infoarchiv
    </button>
  </nav> 
  </div>

  <!-- ============================================== -->
  <!-- ODKAZ NA EXTERNÍ JAVASCRIPT S VERZÍ            -->
  <!-- ============================================== -->
  <script src="app.js?v=1.17"></script>
</body>
</html>
